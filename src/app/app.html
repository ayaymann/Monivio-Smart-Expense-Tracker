<main class="app-container">

  <div class="app-header">
    <div class="title-area">
      <h1><span class="brand-name">Monivio</span> Expense Tracker</h1>
      <p class="subtitle">
        <span class="subtitle-lead">Your money, clearly in view.</span>
        <span class="subtitle-support">Track your spending. Understand your habits. Stay in control.</span>
      </p>
    </div>

    <button
      class="theme-toggle"
      (click)="toggleTheme()"
    >
      {{ isDarkMode ? '☀️ Light' : '🌙 Dark' }}
    </button>
  </div>

  <app-expense-form
    (save)="onSave($event)"
  ></app-expense-form>

  <app-expense-list
    (edit)="editExpense($event)"
  ></app-expense-list>

  <app-chatbot></app-chatbot>

</main>
